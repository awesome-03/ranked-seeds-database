<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <!-- Load sql.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js" defer></script>
  <script type="module" src="assets/js/main.js"></script>

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon/favicon-16x16.png">
  <link rel="manifest" href="assets/img/favicon/site.webmanifest">

  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <title>Ranked SeedBank</title>
</head>

<body>
  <h1>MCSR Ranked SeedBank</h1>
  <main>
    <section id="filter">
      <div class="bg-box">
        <div id="overworld-filter">
          <div class="filter-title">
            <label>Overworld:</label>
            <select name="overworld" id="overworlds">
              <option value="ALL">ALL</option>
              <option value="VILLAGE">VILLAGE</option>
              <option value="SHIPWRECK">SHIPWRECK</option>
              <option value="BURIED_TREASURE">BURIED TREASURE</option>
              <option value="DESERT_TEMPLE">DESERT TEMPLE</option>
              <option value="RUINED_PORTAL">RUINED PORTAL</option>
            </select>
          </div>

          <div class="overworld-extras">
            <div id="shipwreck-type">
              <button type="button" id="shipwreck-btn">
                <span>Shipwreck Type</span>
                <img src="assets/img/right_arrow.png" alt="open/close menu" class="menu-arrow">
              </button>
              <div id="shipwreck-type-content" class="expandable-content">
                <div>
                  <div class="expandable-content-label">
                    <img src="assets/img/shipwreck_rightsideup.png" alt="Normal">
                    <label>Normal</label>
                  </div>

                  <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider">
                      <img src="assets/img/checkmark.png" class="check-icon" alt="✓">
                      <img src="assets/img/cross.png" class="cross-icon" alt="✕">
                      <span class="knob"></span>
                    </span>
                  </label>
                </div>

                <div>
                  <div class="expandable-content-label">
                    <img src="assets/img/shipwreck_with_mast.png" alt="With Mast">
                    <label>With Mast</label>
                  </div>  
                  <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider">
                      <img src="assets/img/checkmark.png" class="check-icon" alt="✓">
                      <img src="assets/img/cross.png" class="cross-icon" alt="✕">
                      <span class="knob"></span>
                    </span>
                  </label>
                </div>
                  
                <div>
                  <div class="expandable-content-label">
                    <img src="assets/img/shipwreck_upsidedown.png" alt="Upside down">
                    <label>Upside Down</label>
                  </div>
                  <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider">
                      <img src="assets/img/checkmark.png" class="check-icon" alt="✓">
                      <img src="assets/img/cross.png" class="cross-icon" alt="✕">
                      <span class="knob"></span>
                    </span>
                  </label>
                </div>
                
                <div>
                  <div class="expandable-content-label">
                    <img src="assets/img/shipwreck_sideways.png" alt="Sideways">
                    <label>Sideways</label>
                  </div>
                  <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider">
                      <img src="assets/img/checkmark.png" class="check-icon" alt="✓">
                      <img src="assets/img/cross.png" class="cross-icon" alt="✕">
                      <span class="knob"></span>
                    </span>
                  </label>
                </div>
              </div>
            </div>

            <div id="biome-type">
              <button type="button" id="biome-btn">
                <span>Biome</span>
                <img src="assets/img/right_arrow.png" alt="open/close menu" class="menu-arrow">
              </button>
              <div id="biome-type-content" class="expandable-content">
                <div>
                  <div class="expandable-content-label">
                    <label>Cold Oceans</label>
                  </div>
                  <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider">
                      <img src="assets/img/checkmark.png" class="check-icon" alt="✓">
                      <img src="assets/img/cross.png" class="cross-icon" alt="✕">
                      <span class="knob"></span>
                    </span>
                  </label>
                </div>

                <div>
                  <div class="expandable-content-label">
                    <label>Warm Oceans</label>
                  </div>
                  <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider">
                      <img src="assets/img/checkmark.png" class="check-icon" alt="✓">
                      <img src="assets/img/cross.png" class="cross-icon" alt="✕">
                      <span class="knob"></span>
                    </span>
                  </label>
                </div>
              </div>
            </div>

            <div id="chest-loot-type">
              <button type="button" id="chest-loot-btn">
                <span>Chest Loot</span>
                <img src="assets/img/right_arrow.png" alt="open/close menu" class="menu-arrow">
              </button>
              <div id="chest-loot-type-content" class="expandable-content">
                <div>
                  <div class="expandable-content-label">
                    <label>Diamond</label>
                  </div>
                  <div class="switch-3way" data-state="neutral">
                    <input type="hidden" name="diamond" value="neutral">
                    <div class="slider-3way">
                      <img src="assets/img/minus.png" class="minus-icon" data-set-state="neutral" alt="-">
                      <img src="assets/img/checkmark.png" class="check-icon" data-set-state="check" alt="✓">
                      <img src="assets/img/cross.png" class="cross-icon" data-set-state="cross" alt="✕">
                      <span class="knob"></span>
                    </div>
                  </div>
                </div>

                <div>
                  <div class="expandable-content-label">
                    <label>Carrot</label>
                  </div>
                  <div class="switch-3way" data-state="neutral">
                    <input type="hidden" name="carrot" value="neutral">
                    <div class="slider-3way">
                      <img src="assets/img/minus.png" class="minus-icon" data-set-state="neutral" alt="-">
                      <img src="assets/img/checkmark.png" class="check-icon" data-set-state="check" alt="✓">
                      <img src="assets/img/cross.png" class="cross-icon" data-set-state="cross" alt="✕">
                      <span class="knob"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <div id="bastion-filter">
          <div class="filter-title">
            <label>Bastion:</label>
            <select name="bastions" id="bastions">
              <option value="ALL">ALL</option>
              <option value="BRIDGE">BRIDGE</option>
              <option value="STABLES">STABLES</option>
              <option value="TREASURE">TREASURE</option>
              <option value="HOUSING">HOUSING</option>
            </select>
          </div>
        </div>

        <div id="fortress-filter">
          <div class="filter-title">
            <label>Fortress Biome:</label>
            <select name="fortress-biomes" id="fortress-biomes">
              <option value="ALL">ALL</option>
              <option value="NETHER_WASTES">NETHER WASTES</option>
              <option value="WARPED_FOREST">WARPED FOREST</option>
              <option value="CRIMSON_FOREST">CRIMSON FOREST</option>
              <option value="BASALT_DELTAS">BASALT DELTAS</option>
              <option value="SOUL_SAND_VALLEY">SOUL SAND VALLEY</option>
            </select>
          </div>
        </div>

        <div id="end-filter">
          <div class="filter-title">
            <label>End Spawn:</label>
            <select name="end-spawns" id="end-spawns">
              <option value="ALL">ALL</option>
              <option value="OPEN_PLATFORM">OPEN</option>
              <option value="BURIED_PLATFORM">BURIED</option>
              <option value="TERRAIN_AROUND_PLATFORM">SURROUNDING TERRAIN</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <section id="data">
      <div class="bg-box">
        <div id="data-titles">
          <p></p>
          <p>Ow/End/Rng</p>
          <p>Nether</p>
          <p>Notes</p>
        </div>

        <hr>

        <div class="data-list">
          <div class="data-row">
            <input type="checkbox">
            <p class="ow-seed">1234567891011</p>
            <p class="nether-seed">1110987654321</p>
            <input type="text" name="notes" class="notes-box" value="This seed was lowkey kinda goated"></input>
          </div>

          <div class="data-row">
            <input type="checkbox">
            <p class="ow-seed">1234567891011</p>
            <p class="nether-seed">1110987654321</p>
            <input type="text" name="notes" class="notes-box" value="Redlime I hate you, auuughghghhh"></input>
          </div>

          <div class="data-row">
            <input type="checkbox">
            <p class="ow-seed">1234567891011</p>
            <p class="nether-seed">1110987654321</p>
            <input type="text" name="notes" class="notes-box"></input>
          </div>
        </div>
      </div>
    </section>

    <section id="collection">
      <div class="bg-box">
        <div>
          Text Here
        </div>
        <div id="collection-buttons">
          <button>Select All</button>
          <button>Remove Selection</button>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
